# 86Box system fan / power supply audio profiles
# Each profile: start (power-on spin-up), loop (running), stop (spin-down).
# Profile 0 must be "None".
#
# The IBM PS/1 fan is at 2.5 (+8 dB) to keep IBMulator's balance: there the
# system channel plays at 100 % and the HDD at 40 %, so the fan sits about
# 1 dB above the hard disk's hum rather than 7 dB below it.

[Profile "0"]
id = 0
name = None
internal_name = none

[Profile "1"]
id = 1
name = IBM PS/1 2121 power supply fan
internal_name = IBM_PS1_2121
start_file = assets/sounds/system/IBM PS1 2121/IBM_PS1_2121_POWER_UP.wav
start_volume = 2.5
loop_file = assets/sounds/system/IBM PS1 2121/IBM_PS1_2121_POWER_ON.wav
loop_volume = 2.5
stop_file = assets/sounds/system/IBM PS1 2121/IBM_PS1_2121_POWER_DOWN.wav
stop_volume = 2.5
