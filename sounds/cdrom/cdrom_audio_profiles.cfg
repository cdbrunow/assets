# 86Box CD-ROM drive audio profiles
#
# spin_start / spin / spin_stop : motor spin-up, running loop, spin-down
# seek_step                     : short seek (fewer than seek_threshold sectors)
# seek_out / seek_in            : long seek toward the rim (higher LBA) /
#                                 toward the hub (lower LBA)
# open_tray / close_tray        : tray (media removed / inserted)
# seek_threshold                : sectors (LBAs); 2000 is about 27 s of CD audio
# idle_timeout                  : seconds of emulated time with no access and
#                                 no audio playing before the disc spins down
#
# Profile 0 must be "None".

[Profile "0"]
id = 0
name = None
internal_name = none

[Profile "1"]
id = 1
name = Generic ATAPI CD-ROM (IBMulator)
internal_name = GENERIC_ATAPI_IBMULATOR
spin_start_file = assets/sounds/cdrom/Generic ATAPI (IBMulator)/GENERIC_ATAPI_SPIN_START.wav
spin_start_volume = 1.0
spin_file = assets/sounds/cdrom/Generic ATAPI (IBMulator)/GENERIC_ATAPI_SPIN.wav
spin_volume = 1.0
spin_stop_file = assets/sounds/cdrom/Generic ATAPI (IBMulator)/GENERIC_ATAPI_SPIN_STOP.wav
spin_stop_volume = 1.0
seek_step_file = assets/sounds/cdrom/Generic ATAPI (IBMulator)/GENERIC_ATAPI_SEEK_STEP.wav
seek_step_volume = 0.8
seek_out_file = assets/sounds/cdrom/Generic ATAPI (IBMulator)/GENERIC_ATAPI_SEEK_OUT.wav
seek_out_volume = 0.8
seek_in_file = assets/sounds/cdrom/Generic ATAPI (IBMulator)/GENERIC_ATAPI_SEEK_IN.wav
seek_in_volume = 0.8
open_tray_file = assets/sounds/cdrom/Generic ATAPI (IBMulator)/GENERIC_ATAPI_OPEN_TRAY.wav
open_tray_volume = 1.0
close_tray_file = assets/sounds/cdrom/Generic ATAPI (IBMulator)/GENERIC_ATAPI_CLOSE_TRAY.wav
close_tray_volume = 1.0
seek_threshold = 2000
idle_timeout = 60
